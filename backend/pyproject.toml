[project]
name = "foxengine"
version = "0.1.0"
description = "FoxEngineReborn API"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "clickhouse-connect>=1.0.0",
    "cryptography>=48.0.0",
    "fastapi>=0.136.1",
    "greenlet>=3",
    "httpx>=0.28.1",
    "lark>=1.3.1",
    "phonenumbers>=9.0.30",
    "procrastinate>=3.8.1",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.12.1",
    "ruff>=0.15.13",
    "sqlalchemy>=2.0.49",
    "ty>=0.0.35",
    "types-aioboto3>=15.5.0",
    "uvicorn[standard]>=0.46.0",
    "python-multipart>=0.0.28",
    "py7zr>=1.1.0",
]

[project.scripts]
foxengine-api = "foxengine.main:run"
foxengine-worker = "foxengine.worker:run_worker"
foxengine-openapi = "foxengine.openapi:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty]
